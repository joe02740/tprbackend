# Google Cloud Build configuration for ThinkPack Solo Backend
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'thinkpack-solo-backend',
      '--image', 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '512Mi',
      '--cpu', '1',
      '--concurrency', '80',
      '--timeout', '300',
      '--max-instances', '10',
      '--min-instances', '0',
      '--set-env-vars', 'NODE_ENV=production',
      '--set-env-vars', 'PORT=8080'
    ]

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/thinkpack-solo-backend:latest'

# Cloud Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build
timeout: '1200s'